<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake</title>
<style>
  :root{
    color-scheme: dark;
  }
  html,body{
    height:100%;
    margin:0;
    background:#1b1d22;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action: none;
    overflow:hidden;
    overscroll-behavior:none;
    position:fixed;
    inset:0;
  }

  .phone{
    width:min(92vw, 380px);
    height:min(100%, 960px);
    display:flex;
    flex-direction:column;
    background:linear-gradient(160deg,#8f9296 0%,#6c6f74 45%,#54565b 100%);
    border-radius:34px;
    padding:22px 20px 26px;
    box-shadow:
      0 25px 50px rgba(0,0,0,0.55),
      inset 0 2px 2px rgba(255,255,255,0.35),
      inset 0 -6px 10px rgba(0,0,0,0.35);
    box-sizing:border-box;
  }

  .brandrow{
    display:flex;
    justify-content:center;
    align-items:center;
    padding:0 4px 10px;
  }
  .earpiece{
    width:46px;
    height:6px;
    border-radius:4px;
    background:#3a3c40;
    box-shadow:inset 0 1px 2px rgba(0,0,0,0.6);
  }

  .screen-bezel{
    position:relative;
    background:#15181a;
    border-radius:10px;
    padding:10px;
    box-shadow:
      inset 0 3px 8px rgba(0,0,0,0.8),
      inset 0 0 0 2px #0b0c0d;
  }
  /* simulated LCD dot-matrix grid + glass glare, laid over the canvas
     at the exact hardware pixel pitch (98x74) so it reads as individual
     display dots rather than a smooth modern screen */
  .screen-bezel::after{
    content:"";
    position:absolute;
    inset:10px;
    border-radius:2px;
    pointer-events:none;
    background-image:
      linear-gradient(135deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 32%),
      linear-gradient(to right, rgba(0,0,0,0.10) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(0,0,0,0.10) 1px, transparent 1px);
    background-size:
      100% 100%,
      calc(100% / 98) 100%,
      100% calc(100% / 74);
    background-repeat: no-repeat, repeat, repeat;
  }

  canvas{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio: 98 / 74;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border-radius:2px;
    touch-action: manipulation;
  }

  /* Nokia 3210-style cluster: a tall C/back pill and a tall OK pill, with
     up/down grouped as their own smaller stacked pair - spread across the
     full phone width (space-between) instead of huddled in the middle */
  .dpad{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:14px 0 0;
  }
  .dpad-updown{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .dbtn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(160deg,#7d8085,#55585d);
    border:none;
    color:#e7e9eb;
    font-size:14px;
    box-shadow:
      0 3px 0 rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.25);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action: manipulation;
  }
  .dbtn:active{
    transform:translateY(2px);
    box-shadow:
      0 1px 0 rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .dbtn-back, .dbtn-ok{
    width:60px;
    height:84px;
    border-radius:28px;
    font-size:12px;
    font-weight:700;
  }
  .dbtn-ok{ background:linear-gradient(160deg,#8a9a72,#5c6a4c); }
  .dbtn-up, .dbtn-down{
    width:48px;
    height:38px;
    font-size:16px;
  }
  .dbtn-up{ border-radius:9px 9px 4px 4px; }
  .dbtn-down{ border-radius:4px 4px 9px 9px; }

  .keypad{
    position:relative;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:8px;
    padding-top:16px;
    margin-top:auto;
  }

  .key{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:44px;
    background:linear-gradient(160deg,#7d8085,#55585d);
    border:none;
    border-radius:9px;
    color:#e7e9eb;
    box-shadow:
      0 3px 0 rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.25);
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action: manipulation;
  }
  .key:active{
    transform:translateY(2px);
    box-shadow:
      0 1px 0 rgba(0,0,0,0.45),
      inset 0 1px 0 rgba(255,255,255,0.15);
  }
  .key .num{
    font-size:16px;
    font-weight:700;
    line-height:1;
  }
  .key .letters{
    font-size:7px;
    letter-spacing:1px;
    color:#c7cace;
    margin-top:2px;
  }
  .key-mid{
    background:linear-gradient(160deg,#8a9a72,#5c6a4c);
  }
</style>
</head>
<body>

  <div class="phone">
    <div class="brandrow">
      <div class="earpiece"></div>
    </div>

    <div class="screen-bezel">
      <canvas id="game" width="98" height="74"></canvas>
    </div>

    <div class="dpad">
      <button class="dbtn dbtn-back" data-key="*">BACK</button>
      <button class="dbtn dbtn-ok" data-key="Enter">OK</button>
      <div class="dpad-updown">
        <button class="dbtn dbtn-up" data-key="ArrowUp">&#9650;</button>
        <button class="dbtn dbtn-down" data-key="ArrowDown">&#9660;</button>
      </div>
    </div>

    <div class="keypad">
      <button class="key" data-action="corner-ul" data-digit="1"><span class="num">1</span></button>
      <button class="key" data-action="up" data-digit="2"><span class="num">2</span><span class="letters">ABC</span></button>
      <button class="key" data-action="" data-digit="3"><span class="num">3</span><span class="letters">DEF</span></button>

      <button class="key" data-action="left" data-digit="4"><span class="num">4</span><span class="letters">GHI</span></button>
      <button class="key key-mid" data-action="action" data-digit="5"><span class="num">5</span><span class="letters">JKL</span></button>
      <button class="key" data-action="right" data-digit="6"><span class="num">6</span><span class="letters">MNO</span></button>

      <button class="key" data-action="" data-digit="7"><span class="num">7</span><span class="letters">PQRS</span></button>
      <button class="key" data-action="down" data-digit="8"><span class="num">8</span><span class="letters">TUV</span></button>
      <button class="key" data-action="corner-dr" data-digit="9"><span class="num">9</span><span class="letters">WXYZ</span></button>

      <button class="key" data-action="back" data-digit="*">✻</button>
      <button class="key" data-action="" data-digit="0"><span class="num">0</span></button>
      <button class="key" data-action="" data-digit="#">#</button>
    </div>
  </div>

<script>
(function(){
  "use strict";

  // ---------- 5x7 pixel font ----------
  var FONT = {
    "0":["01110","10001","10011","10101","11001","10001","01110"],
    "1":["00100","01100","00100","00100","00100","00100","11111"],
    "2":["01110","10001","00001","00010","00100","01000","11111"],
    "3":["01110","10001","00001","00110","00001","10001","01110"],
    "4":["00010","00110","01010","10010","11111","00010","00010"],
    "5":["11111","10000","11110","00001","00001","10001","01110"],
    "6":["00110","01000","10000","11110","10001","10001","01110"],
    "7":["11111","00001","00010","00100","01000","01000","01000"],
    "8":["01110","10001","10001","01110","10001","10001","01110"],
    "9":["01110","10001","10001","01111","00001","00010","01100"],
    "A":["01110","10001","10001","11111","10001","10001","10001"],
    "B":["11110","10001","10001","11110","10001","10001","11110"],
    "C":["01111","10000","10000","10000","10000","10000","01111"],
    "D":["11110","10001","10001","10001","10001","10001","11110"],
    "E":["11111","10000","10000","11110","10000","10000","11111"],
    "F":["11111","10000","10000","11110","10000","10000","10000"],
    "G":["01111","10000","10000","10111","10001","10001","01111"],
    "H":["10001","10001","10001","11111","10001","10001","10001"],
    "I":["11111","00100","00100","00100","00100","00100","11111"],
    "J":["00001","00001","00001","00001","00001","10001","01110"],
    "K":["10001","10010","10100","11000","10100","10010","10001"],
    "L":["10000","10000","10000","10000","10000","10000","11111"],
    "M":["10001","11011","10101","10001","10001","10001","10001"],
    "N":["10001","11001","10101","10011","10001","10001","10001"],
    "O":["01110","10001","10001","10001","10001","10001","01110"],
    "P":["11110","10001","10001","11110","10000","10000","10000"],
    "Q":["01110","10001","10001","10001","10101","10010","01101"],
    "R":["11110","10001","10001","11110","10100","10010","10001"],
    "S":["01111","10000","10000","01110","00001","00001","11110"],
    "T":["11111","00100","00100","00100","00100","00100","00100"],
    "U":["10001","10001","10001","10001","10001","10001","01110"],
    "V":["10001","10001","10001","10001","10001","01010","00100"],
    "W":["10001","10001","10001","10101","10101","11011","10001"],
    "X":["10001","10001","01010","00100","01010","10001","10001"],
    "Y":["10001","10001","01010","00100","00100","00100","00100"],
    "Z":["11111","00001","00010","00100","01000","10000","11111"],
    " ":["00000","00000","00000","00000","00000","00000","00000"],
    "-":["00000","00000","00000","11111","00000","00000","00000"],
    "/":["00001","00001","00010","00100","01000","10000","10000"],
    "!":["00100","00100","00100","00100","00100","00000","00100"],
    ">":["01000","00100","00010","00001","00010","00100","01000"],
    "_":["00000","00000","00000","00000","00000","00000","11111"],
    "*":["00000","01010","00100","11111","00100","01010","00000"],
    "#":["01010","01010","11111","01010","11111","01010","01010"],
    "=":["00000","00000","11111","00000","11111","00000","00000"]
  };

  function drawText(ctx, str, x, y, on){
    var cx = x;
    for (var i=0;i<str.length;i++){
      var g = FONT[str[i]] || FONT[" "];
      for (var r=0;r<7;r++){
        for (var c=0;c<5;c++){
          if (g[r][c] === "1"){
            ctx.fillRect(cx+c, y+r, 1, 1);
          }
        }
      }
      cx += 6;
    }
    return cx;
  }
  function textWidth(str){ return str.length*6 - 1; }

  // ---------- config ----------
  var CELL = 4;
  var HUD_H = 8;
  var GRID_W = 24;
  var GRID_H = 16;
  var BORDER = 1;
  var OX = BORDER;
  var OY = HUD_H + BORDER;
  var W = GRID_W*CELL + BORDER*2;              // 98
  var H = HUD_H + GRID_H*CELL + BORDER*2;       // 74

  var BG = "#c7d68f";
  var FG = "#2b2f1a";
  var MID = "#6f7a52"; // lighter "second gray" tone for the opponent's snake in multiplayer

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  ctx.imageSmoothingEnabled = false;

  var HS_KEY = "snakeHighScore";
  var legacyHighScore = localStorage.getItem("nokiaSnakeHighScore");
  if (legacyHighScore !== null && localStorage.getItem(HS_KEY) === null){
    localStorage.setItem(HS_KEY, legacyHighScore);
    localStorage.removeItem("nokiaSnakeHighScore");
  }
  var highScore = parseInt(localStorage.getItem(HS_KEY) || "0", 10) || 0;

  var state = "menu";
  // menu | highscore | howto | playing | paused | gameover | nameentry |
  // mpmenu | mphostoptions | mphostwait | mpjoinmenu | mpjoinlist | mpjoincode | mpplaying | mpresult
  var wallsEnabled = true; // classic mode: hitting the border ends the run
  var menuIndex = 0;
  var MENU_ACTIONS = ["play", "multiplayer", "options", "highscore", "howto"];
  var optionsIndex = 0;
  var bigCornerButtons = localStorage.getItem("snakeBigCorner") === "1";
  var snake, dir, dirQueue, food, score, tickMs, acc, lastTime, justHitHighScore;

  // ---------- daily server leaderboard ----------
  var MAX_BOARD_ENTRIES = 5;
  var leaderboard = [];
  var leaderboardDate = null;
  var leaderboardAvailable = false;
  var pendingScore = 0;
  var nameEntry = null;

  function getClientId(){
    var id = localStorage.getItem("snakeClientId");
    if (!id){
      id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : ("c" + Date.now() + Math.random().toString(36).slice(2));
      localStorage.setItem("snakeClientId", id);
    }
    return id;
  }

  function loadLeaderboard(){
    wsConnect().then(function(){
      wsSend({type: "getHighscores"});
    }).catch(function(){ leaderboardAvailable = false; });
  }
  loadLeaderboard();

  function qualifiesForBoard(s){
    if (!leaderboardAvailable || s <= 0) return false;
    if (leaderboard.length < MAX_BOARD_ENTRIES) return true;
    return s > leaderboard[leaderboard.length-1].score;
  }

  var T9_MAP = {
    "0":[" "], "1":["1"],
    "2":["A","B","C"], "3":["D","E","F"], "4":["G","H","I"],
    "5":["J","K","L"], "6":["M","N","O"], "7":["P","Q","R","S"],
    "8":["T","U","V"], "9":["W","X","Y","Z"]
  };
  var T9_TIMEOUT_MS = 700;

  function startNameEntry(mode){ // mode: "submit" (after a qualifying game) or "edit" (from OPTIONS)
    var stored = (localStorage.getItem("snakePlayerName") || "").toUpperCase().slice(0, 8);
    nameEntry = {
      chars: stored ? stored.split("") : [],
      lastDigit: null,
      lastPressTime: 0,
      cycleIndex: 0,
      error: null,
      mode: mode
    };
    if (mode === "submit") pendingScore = score;
    state = "nameentry";
  }

  function nameEntryKey(key){
    if (!nameEntry) return;
    nameEntry.error = null;
    var now = Date.now();
    if (key === "Backspace" || key === "*"){
      if (nameEntry.chars.length){
        nameEntry.chars.pop();
        nameEntry.lastDigit = null;
      } else if (key === "*"){
        state = nameEntry.mode === "edit" ? "options" : "gameover";
      }
      return;
    }
    if (key === "Enter" || key === "#"){
      confirmNameEntry();
      return;
    }
    if (key === "Escape"){
      state = nameEntry.mode === "edit" ? "options" : "gameover";
      return;
    }
    if (/^[a-zA-Z]$/.test(key)){
      if (nameEntry.chars.length < 8) nameEntry.chars.push(key.toUpperCase());
      nameEntry.lastDigit = null;
      return;
    }
    var letters = T9_MAP[key];
    if (!letters) return;
    if (nameEntry.lastDigit === key && (now - nameEntry.lastPressTime) < T9_TIMEOUT_MS && nameEntry.chars.length){
      nameEntry.cycleIndex = (nameEntry.cycleIndex + 1) % letters.length;
      nameEntry.chars[nameEntry.chars.length-1] = letters[nameEntry.cycleIndex];
    } else {
      if (nameEntry.chars.length >= 8) return;
      nameEntry.chars.push(letters[0]);
      nameEntry.cycleIndex = 0;
      nameEntry.lastDigit = key;
    }
    nameEntry.lastPressTime = now;
  }

  function confirmNameEntry(){
    var name = nameEntry.chars.join("").trim();
    if (nameEntry.mode === "edit"){
      if (name) localStorage.setItem("snakePlayerName", name);
      state = "options";
      return;
    }
    if (!name){
      state = "gameover"; // nothing typed - treat as skip
      return;
    }
    localStorage.setItem("snakePlayerName", name);
    wsConnect().then(function(){
      wsSend({type: "submitHighscore", name: name, score: pendingScore, clientId: getClientId()});
    }).catch(function(){
      state = "gameover"; // offline - just skip saving
    });
  }

  function menuLabel(i){
    switch(MENU_ACTIONS[i]){
      case "play": return "PLAY";
      case "multiplayer": return "MULTIPLAYER";
      case "options": return "OPTIONS";
      case "highscore": return "HIGH SCORE";
      case "howto": return "HOW TO PLAY";
    }
  }

  function optionsItems(){
    return [
      "WALLS " + (wallsEnabled ? "ON" : "OFF"),
      "1/9 ONLY " + (bigCornerButtons ? "ON" : "OFF"),
      "NAME " + myStoredName("----")
    ];
  }

  // ---------- server connection (highscores + multiplayer) ----------
  // One persistent WebSocket, opened lazily on first need and kept open for
  // the rest of the session, used for both the daily highscore board and
  // 1v1 multiplayer. For multiplayer the server pushes a fresh state
  // message the instant anything changes (every tick during play,
  // immediately on join/replay/disconnect) - there is no polling and no
  // client-side clock to keep in sync, so there is nothing to drift.
  var ws = null;
  var mp = null;              // active room session, or null
  var mpSubIndex = 0;         // shared selection index for the small mp menus
  var mpJoinDigits = [];
  var mpJoinError = null;
  var mpPublicRooms = [];
  var mpListTimer = null;

  function isMpState(s){ return typeof s === "string" && s.indexOf("mp") === 0; }

  function myStoredName(fallback){
    return (localStorage.getItem("snakePlayerName") || fallback).toUpperCase().slice(0, 8);
  }

  function wsConnect(){
    if (ws && ws.readyState === WebSocket.OPEN) return Promise.resolve(ws);
    return new Promise(function(resolve, reject){
      var proto = location.protocol === "https:" ? "wss://" : "ws://";
      var sock = new WebSocket(proto + location.host + "/");
      var settled = false;
      sock.onopen = function(){
        settled = true;
        ws = sock;
        resolve(sock);
      };
      sock.onerror = function(){
        if (!settled){ settled = true; reject(new Error("ws error")); }
      };
      sock.onclose = function(){
        if (!settled){ settled = true; reject(new Error("ws closed")); return; }
        ws = null;
        leaderboardAvailable = false;
        if (isMpState(state)){
          // connection dropped mid-session - no reconnect support yet,
          // just bail back to the menu rather than sit on a dead screen
          mp = null;
          state = "menu";
        }
      };
      sock.onmessage = function(ev){
        var msg;
        try { msg = JSON.parse(ev.data); } catch(e){ return; }
        handleWsMessage(msg);
      };
    });
  }

  function wsSend(obj){
    if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
  }

  function handleWsMessage(msg){
    if (msg.type === "highscores"){
      leaderboard = msg.entries || [];
      leaderboardDate = msg.date;
      leaderboardAvailable = true;
      if (state === "nameentry" && nameEntry && nameEntry.mode === "submit") state = "gameover"; // just-submitted score was accepted
    } else if (msg.type === "highscoreError"){
      if (state === "nameentry" && nameEntry && nameEntry.mode === "submit"){
        nameEntry.error = msg.error === "profanity" ? "NOT ALLOWED" : "INVALID NAME";
      }
    } else if (msg.type === "hosted"){
      mp = {
        code: msg.code, public: msg.public, wallsEnabled: msg.walls,
        you: null, opponent: null, food: null, status: "waiting", winner: null, endReason: null, voted: false
      };
      state = "mphostwait";
    } else if (msg.type === "joined"){
      mp = {
        code: msg.code, public: null, wallsEnabled: msg.walls,
        you: null, opponent: null, food: null, status: "countdown", countdown: null,
        winner: null, endReason: null, voted: false
      };
      state = "mpplaying";
    } else if (msg.type === "error"){
      if (state === "mpjoincode"){
        mpJoinError = msg.message === "not_found" ? "NOT FOUND"
          : msg.message === "profanity" ? "NOT ALLOWED" : "UNAVAILABLE";
        mpJoinDigits = [];
      }
    } else if (msg.type === "publicRooms"){
      mpPublicRooms = msg.rooms || [];
      if (mpSubIndex >= mpPublicRooms.length) mpSubIndex = 0;
    } else if (msg.type === "state"){
      if (!mp) return;
      mp.you = msg.you;
      mp.opponent = msg.opponent;
      mp.food = msg.food;
      mp.status = msg.status;
      mp.wallsEnabled = msg.wallsEnabled;
      mp.countdown = msg.countdown;
      mp.winner = msg.winner;
      mp.endReason = msg.endReason;
      if ((mp.status === "playing" || mp.status === "countdown") && (state === "mphostwait" || state === "mpresult")){
        state = "mpplaying";
        mp.voted = false;
      }
      if (mp.status === "ended" && state !== "mpresult"){
        state = "mpresult";
        mpSubIndex = 0;
        mp.voted = false;
      }
    }
  }

  function startHostGame(isPublic){
    wsConnect().then(function(){
      wsSend({type: "host", public: isPublic, name: myStoredName("HOST"), walls: wallsEnabled});
    }).catch(function(){});
  }

  function enterJoinList(){
    mpSubIndex = 0;
    state = "mpjoinlist";
    wsConnect().then(function(){
      wsSend({type: "listPublic"});
      if (mpListTimer) clearInterval(mpListTimer);
      mpListTimer = setInterval(function(){
        if (state === "mpjoinlist") wsSend({type: "listPublic"});
        else { clearInterval(mpListTimer); mpListTimer = null; }
      }, 1500);
    }).catch(function(){});
  }

  function joinRoomByCode(code){
    wsConnect().then(function(){
      wsSend({type: "join", code: code, name: myStoredName("GUEST")});
    }).catch(function(){
      mpJoinError = "UNAVAILABLE";
      mpJoinDigits = [];
    });
  }

  function sendMpDirection(d){
    wsSend({type: "input", dir: d});
  }

  function leaveMp(){
    if (mpListTimer){ clearInterval(mpListTimer); mpListTimer = null; }
    wsSend({type: "leaveRoom"});
    mp = null;
  }

  // corner-turn (keys 1/9) for multiplayer: same idea as solo's cornerTurn -
  // pick whichever of the two perpendicular directions isn't a no-op/reversal
  // of the CURRENT heading. There's no local dirQueue in multiplayer (the
  // server is authoritative), so the current heading is read back from the
  // last two body segments the server sent, rather than tracked client-side.
  function mpCurrentDir(){
    var body = mp && mp.you && mp.you.body;
    if (!body || body.length < 2) return {x:1, y:0};
    return {x: body[0][0]-body[1][0], y: body[0][1]-body[1][1]};
  }

  function mpCornerPick(a, b){
    var cur = mpCurrentDir();
    function same(v){ return cur.x===v.x && cur.y===v.y; }
    function reverse(v){ return cur.x===-v.x && cur.y===-v.y; }
    if (!same(a) && !reverse(a)) return a;
    if (!same(b) && !reverse(b)) return b;
    return null;
  }

  // shared by every list-style menu screen (solo's main menu/options, and
  // multiplayer's mode/host-options/join-options/room-list/result screens):
  // up/down cycle a selected index with wraparound and return the new
  // value; action/select and back just fire a callback and return
  // undefined, since those callbacks often set the index themselves (e.g.
  // resetting to 0 when moving to a different screen) - returning the
  // stale pre-call index there would silently overwrite that. Callers only
  // assign the index back when the return value isn't undefined.
  // Extracted because each screen used to reimplement this cycling from
  // scratch - which is exactly how the "1/9 does nothing in multiplayer"
  // bug happened: a fix/feature added to one copy never made it into the
  // others.
  function menuCycle(kind, index, count, onSelect, onBack){
    if (kind === "up" && count) return (index - 1 + count) % count;
    if (kind === "down" && count) return (index + 1) % count;
    if (kind === "back"){ if (onBack) onBack(); return undefined; }
    if ((kind === "action" || kind === "select") && count && onSelect) onSelect();
    return undefined;
  }

  function mpNormalizeKey(key){
    if (key === "ArrowUp" || key === "w" || key === "W" || key === "2") return "up";
    if (key === "ArrowDown" || key === "s" || key === "S" || key === "8") return "down";
    if (key === " " || key === "5" || key === "Enter" || key === "#") return "select";
    if (key === "*" || key === "Escape") return "back";
    return null;
  }

  function handleMpKey(rawKey){
    if (state === "mpjoincode"){
      mpJoinError = null;
      if (rawKey === "*"){
        if (mpJoinDigits.length) mpJoinDigits.pop();
        else { state = "mpjoinmenu"; mpSubIndex = 0; }
        return;
      }
      if (rawKey === "Backspace"){ mpJoinDigits.pop(); return; }
      if (rawKey === "Escape"){ state = "mpjoinmenu"; mpSubIndex = 0; return; }
      if (/^[0-9]$/.test(rawKey)){
        if (mpJoinDigits.length < 4) mpJoinDigits.push(rawKey);
        if (mpJoinDigits.length === 4) joinRoomByCode(mpJoinDigits.join(""));
      }
      return;
    }

    if (state === "mpplaying"){
      var dir = null;
      switch(rawKey){
        case "ArrowUp": case "w": case "W": case "2": dir = {x:0,y:-1}; break;
        case "ArrowDown": case "s": case "S": case "8": dir = {x:0,y:1}; break;
        case "ArrowLeft": case "a": case "A": case "4": dir = {x:-1,y:0}; break;
        case "ArrowRight": case "d": case "D": case "6": dir = {x:1,y:0}; break;
        case "1": dir = mpCornerPick({x:0,y:-1}, {x:-1,y:0}); break;
        case "9": dir = mpCornerPick({x:0,y:1}, {x:1,y:0}); break;
        case "*": case "Escape": leaveMp(); state = "menu"; return;
      }
      if (dir) sendMpDirection(dir);
      return;
    }

    var action = mpNormalizeKey(rawKey);
    if (!action) return;

    if (state === "mpmenu"){
      var r1 = menuCycle(action, mpSubIndex, 2, function(){
        state = mpSubIndex === 0 ? "mphostoptions" : "mpjoinmenu";
        mpSubIndex = 0;
      }, function(){ state = "menu"; });
      if (r1 !== undefined) mpSubIndex = r1;
      return;
    }

    if (state === "mphostoptions"){
      var r2 = menuCycle(action, mpSubIndex, 2,
        function(){ startHostGame(mpSubIndex === 0); },
        function(){ state = "mpmenu"; mpSubIndex = 0; });
      if (r2 !== undefined) mpSubIndex = r2;
      return;
    }

    if (state === "mphostwait"){
      if (action === "back"){ leaveMp(); state = "mpmenu"; mpSubIndex = 0; }
      return;
    }

    if (state === "mpjoinmenu"){
      var r3 = menuCycle(action, mpSubIndex, 2, function(){
        if (mpSubIndex === 0) enterJoinList();
        else { mpJoinDigits = []; mpJoinError = null; state = "mpjoincode"; }
      }, function(){ state = "mpmenu"; mpSubIndex = 0; });
      if (r3 !== undefined) mpSubIndex = r3;
      return;
    }

    if (state === "mpjoinlist"){
      var r4 = menuCycle(action, mpSubIndex, mpPublicRooms.length,
        function(){ joinRoomByCode(mpPublicRooms[mpSubIndex].code); },
        function(){ state = "mpjoinmenu"; mpSubIndex = 0; });
      if (r4 !== undefined) mpSubIndex = r4;
      return;
    }

    if (state === "mpresult"){
      if (mp && mp.voted){
        if (action === "back"){ leaveMp(); state = "menu"; }
        return;
      }
      var r5 = menuCycle(action, mpSubIndex, 2, function(){
        if (mpSubIndex === 0){
          mp.voted = true;
          wsSend({type: "replay"});
        } else { leaveMp(); state = "menu"; }
      }, function(){ leaveMp(); state = "menu"; });
      if (r5 !== undefined) mpSubIndex = r5;
      return;
    }
  }

  function resetGame(){
    var cx = Math.floor(GRID_W/2), cy = Math.floor(GRID_H/2);
    snake = [
      {x:cx-1,y:cy},
      {x:cx-2,y:cy},
      {x:cx-3,y:cy}
    ];
    dir = {x:1,y:0};
    dirQueue = [];
    score = 0;
    tickMs = 160;
    acc = 0;
    justHitHighScore = false;
    placeFood();
  }

  function placeFood(){
    var ok = false, fx, fy;
    while(!ok){
      fx = Math.floor(Math.random()*GRID_W);
      fy = Math.floor(Math.random()*GRID_H);
      ok = !snake.some(function(s){ return s.x===fx && s.y===fy; });
    }
    food = {x:fx, y:fy};
  }

  function setDirection(nx, ny){
    // buffer up to 2 pending turns so a fast one-two key combo (e.g.
    // down then right while moving left) applies over two ticks instead
    // of being validated only against the currently-moving direction
    var last = dirQueue.length ? dirQueue[dirQueue.length-1] : dir;
    if (last.x === nx && last.y === ny) return; // no-op, same as last queued
    if (snake.length>1 && last.x === -nx && last.y === -ny) return; // would reverse
    if (dirQueue.length >= 2) return; // buffer full
    dirQueue.push({x:nx, y:ny});
  }

  function cornerTurn(a, b){
    // dual-function corner key: turns toward whichever of the two
    // perpendicular directions isn't the one already in use
    var cur = dirQueue.length ? dirQueue[dirQueue.length-1] : dir;
    function same(v){ return cur.x===v.x && cur.y===v.y; }
    function reverse(v){ return cur.x===-v.x && cur.y===-v.y; }
    if (!same(a) && !reverse(a)) setDirection(a.x, a.y);
    else if (!same(b) && !reverse(b)) setDirection(b.x, b.y);
  }

  function handleAction(kind){
    if (state === "menu"){
      var rMenu = menuCycle(kind, menuIndex, MENU_ACTIONS.length, selectMenuItem, null);
      if (rMenu !== undefined) menuIndex = rMenu;
      return;
    }
    if (state === "highscore" || state === "howto"){
      if (kind === "action" || kind === "back") state = "menu";
      return;
    }
    if (state === "options"){
      var optItems = optionsItems();
      var rOpt = menuCycle(kind, optionsIndex, optItems.length, function(){
        if (optionsIndex === 0){
          wallsEnabled = !wallsEnabled;
        } else if (optionsIndex === 1){
          bigCornerButtons = !bigCornerButtons;
          localStorage.setItem("snakeBigCorner", bigCornerButtons ? "1" : "0");
        } else if (optionsIndex === 2){
          startNameEntry("edit");
        }
      }, function(){ state = "menu"; });
      if (rOpt !== undefined) optionsIndex = rOpt;
      return;
    }

    if (kind === "up") setDirection(0,-1);
    else if (kind === "down") setDirection(0,1);
    else if (kind === "left") setDirection(-1,0);
    else if (kind === "right") setDirection(1,0);
    else if (kind === "action") pressAction();
    else if (kind === "corner-ul") cornerTurn({x:0,y:-1}, {x:-1,y:0}); // key 1: up/left
    else if (kind === "corner-dr") cornerTurn({x:0,y:1}, {x:1,y:0});   // key 9: down/right
  }

  function selectMenuItem(){
    var action = MENU_ACTIONS[menuIndex];
    if (action === "play"){
      resetGame();
      state = "playing";
    } else if (action === "multiplayer"){
      mpSubIndex = 0;
      state = "mpmenu";
    } else if (action === "options"){
      optionsIndex = 0;
      state = "options";
    } else if (action === "highscore"){
      loadLeaderboard();
      state = "highscore";
    } else if (action === "howto"){
      state = "howto";
    }
  }

  function pressAction(){
    if (state === "playing") state = "paused";
    else if (state === "paused") state = "playing";
    else if (state === "gameover") state = "menu";
  }

  function step(){
    if (dirQueue.length) dir = dirQueue.shift();
    var head = snake[0];
    var nx = head.x + dir.x;
    var ny = head.y + dir.y;

    if (nx < 0 || nx >= GRID_W || ny < 0 || ny >= GRID_H){
      if (wallsEnabled) return gameOver();
      nx = (nx + GRID_W) % GRID_W;
      ny = (ny + GRID_H) % GRID_H;
    }
    for (var i=0;i<snake.length;i++){
      if (snake[i].x === nx && snake[i].y === ny) return gameOver();
    }

    snake.unshift({x:nx, y:ny});

    if (nx === food.x && ny === food.y){
      score += 10;
      if (score > highScore){
        highScore = score;
        justHitHighScore = true;
        localStorage.setItem(HS_KEY, String(highScore));
      }
      tickMs = Math.max(70, 160 - Math.floor(score/50)*4);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver(){
    if (qualifiesForBoard(score)){
      startNameEntry("submit");
    } else {
      state = "gameover";
    }
  }

  // ---------- drawing ----------
  function clear(){
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = FG;
  }

  function drawHud(){
    ctx.fillStyle = FG;
    var s = String(score);
    drawText(ctx, s, 2, 1, FG);
    var hs = "HI " + highScore;
    drawText(ctx, hs, W-2-textWidth(hs), 1, FG);
  }

  function drawBorder(){
    ctx.fillStyle = FG;
    ctx.fillRect(0, HUD_H, W, 1);
    ctx.fillRect(0, H-1, W, 1);
    ctx.fillRect(0, HUD_H, 1, H-HUD_H);
    ctx.fillRect(W-1, HUD_H, 1, H-HUD_H);
  }

  function drawSnake(){
    ctx.fillStyle = FG;
    for (var i=0;i<snake.length;i++){
      var seg = snake[i];
      var px = OX + seg.x*CELL;
      var py = OY + seg.y*CELL;
      ctx.fillRect(px, py, CELL-1, CELL-1);
    }
  }

  function drawFood(){
    ctx.fillStyle = FG;
    var px = OX + food.x*CELL;
    var py = OY + food.y*CELL;
    // small plus/cross so it reads differently from a snake segment
    ctx.fillRect(px+1, py,   1, 1);
    ctx.fillRect(px,   py+1, 3, 1);
    ctx.fillRect(px+1, py+2, 1, 1);
  }

  function centerText(lines, yStart){
    ctx.fillStyle = FG;
    lines.forEach(function(line, idx){
      var x = Math.floor((W - textWidth(line))/2);
      drawText(ctx, line, x, yStart + idx*9, FG);
    });
  }

  function drawOverlayBox(lines){
    var lineH = 9;
    var boxW = Math.max.apply(null, lines.map(textWidth)) + 8;
    var boxH = lines.length*lineH + 6;
    var bx = Math.floor((W-boxW)/2);
    var by = Math.floor((H-boxH)/2);
    ctx.fillStyle = BG;
    ctx.fillRect(bx, by, boxW, boxH);
    ctx.fillStyle = FG;
    ctx.fillRect(bx, by, boxW, 1);
    ctx.fillRect(bx, by+boxH-1, boxW, 1);
    ctx.fillRect(bx, by, 1, boxH);
    ctx.fillRect(bx+boxW-1, by, 1, boxH);
    centerText(lines, by+4);
  }

  function drawListMenu(title, items, selectedIndex){
    var lineH = 9;
    var cursorW = 8;
    var maxItemW = items.length ? Math.max.apply(null, items.map(textWidth)) : textWidth("NONE");
    var boxW = Math.max(textWidth(title), cursorW + maxItemW) + 8;
    var boxH = lineH + 3 + Math.max(items.length, 1)*lineH + 6;
    var bx = Math.floor((W-boxW)/2);
    var by = Math.floor((H-boxH)/2);

    ctx.fillStyle = BG;
    ctx.fillRect(bx, by, boxW, boxH);
    ctx.fillStyle = FG;
    ctx.fillRect(bx, by, boxW, 1);
    ctx.fillRect(bx, by+boxH-1, boxW, 1);
    ctx.fillRect(bx, by, 1, boxH);
    ctx.fillRect(bx+boxW-1, by, 1, boxH);

    drawText(ctx, title, bx + Math.floor((boxW-textWidth(title))/2), by+4, FG);

    var listY = by + 4 + lineH + 3;
    if (items.length === 0){
      drawText(ctx, "NONE", bx+4+cursorW, listY, FG);
    }
    items.forEach(function(label, i){
      var ly = listY + i*lineH;
      if (i === selectedIndex) drawText(ctx, ">", bx+4, ly, FG);
      drawText(ctx, label, bx+4+cursorW, ly, FG);
    });
  }

  function drawMenuBox(){
    var items = MENU_ACTIONS.map(function(_, i){ return menuLabel(i); });
    drawListMenu("SNAKE", items, menuIndex);
  }

  function render(){
    clear();
    if (isMpState(state)) drawMpHud(); else drawHud();
    drawBorder();

    if (state === "menu"){
      drawSnakeDecor();
      drawMenuBox();
    } else if (state === "highscore"){
      drawHighscoreBox();
    } else if (state === "howto"){
      drawOverlayBox(["HOW TO PLAY","2 4 6 8 MOVE","1/9 CORNER TURN","OK PAUSE/SELECT","PRESS OK"]);
    } else if (state === "options"){
      drawListMenu("OPTIONS", optionsItems(), optionsIndex);
    } else if (state === "playing"){
      drawSnake();
      drawFood();
    } else if (state === "paused"){
      drawSnake();
      drawFood();
      drawOverlayBox(["PAUSED"]);
    } else if (state === "nameentry"){
      if (nameEntry && nameEntry.mode === "submit"){
        drawSnake();
        drawFood();
      }
      drawNameEntryBox();
    } else if (state === "gameover"){
      drawSnake();
      drawFood();
      var lines = ["GAME OVER"];
      if (justHitHighScore) lines.push("NEW HIGH SCORE!");
      lines.push("PRESS OK");
      drawOverlayBox(lines);
    } else if (state === "mpmenu"){
      drawListMenu("MULTIPLAYER", ["HOST GAME","JOIN GAME"], mpSubIndex);
    } else if (state === "mphostoptions"){
      drawListMenu("HOST GAME", ["PUBLIC","PRIVATE"], mpSubIndex);
    } else if (state === "mphostwait"){
      drawOverlayBox([
        "CODE " + (mp ? mp.code : "----"),
        (mp && mp.public ? "PUBLIC" : "PRIVATE") + " " + (mp && mp.wallsEnabled ? "#" : "O"),
        "WAITING...",
        "BACK=CANCEL"
      ]);
    } else if (state === "mpjoinmenu"){
      drawListMenu("JOIN GAME", ["PUBLIC LIST","ENTER CODE"], mpSubIndex);
    } else if (state === "mpjoinlist"){
      var roomItems = mpPublicRooms.map(function(r){ return r.code + " " + r.hostName + " " + (r.walls ? "#" : "O"); });
      drawListMenu("ROOMS", roomItems, mpSubIndex);
    } else if (state === "mpjoincode"){
      var padded = mpJoinDigits.join("") + "_".repeat(4 - mpJoinDigits.length);
      drawOverlayBox([mpJoinError || "ENTER CODE", padded, "BACK=DEL"]);
    } else if (state === "mpplaying"){
      drawMpPlaying();
    } else if (state === "mpresult"){
      drawMpResult();
    }
  }

  function drawMpHud(){
    ctx.fillStyle = FG;
    var myScore = (mp && mp.you) ? mp.you.score : 0;
    drawText(ctx, String(myScore), 2, 1, FG);
    var label = "OP " + ((mp && mp.opponent) ? mp.opponent.score : 0);
    drawText(ctx, label, W-2-textWidth(label), 1, FG);
  }

  function drawMpPlaying(){
    if (!mp) return;
    var oppBody = mp.opponent ? mp.opponent.body : [];
    var myBody = mp.you ? mp.you.body : [];
    ctx.fillStyle = MID;
    oppBody.forEach(function(seg){
      ctx.fillRect(OX+seg[0]*CELL, OY+seg[1]*CELL, CELL-1, CELL-1);
    });
    ctx.fillStyle = FG;
    myBody.forEach(function(seg){
      ctx.fillRect(OX+seg[0]*CELL, OY+seg[1]*CELL, CELL-1, CELL-1);
    });
    if (mp.food){
      var px = OX + mp.food[0]*CELL, py = OY + mp.food[1]*CELL;
      ctx.fillRect(px+1, py,   1, 1);
      ctx.fillRect(px,   py+1, 3, 1);
      ctx.fillRect(px+1, py+2, 1, 1);
    }
    if (mp.status === "countdown" && mp.countdown){
      drawOverlayBox([String(mp.countdown)]);
    }
  }

  function drawMpResult(){
    var title;
    if (!mp || !mp.opponent) title = "OPPONENT LEFT";
    else if (mp.winner === "you") title = "YOU WIN!";
    else if (mp.winner === "opponent") title = "YOU LOSE";
    else title = "DRAW";

    var myScore = (mp && mp.you) ? mp.you.score : 0;
    var oppScore = (mp && mp.opponent) ? mp.opponent.score : 0;
    var lines = [title, "YOU " + myScore, "OPP " + oppScore];

    if (!mp || !mp.opponent){
      lines.push("PRESS OK");
    } else if (mp.voted){
      lines.push("WAITING...");
    } else {
      var items = ["REPLAY","EXIT"];
      items.forEach(function(label, i){
        lines.push((i === mpSubIndex ? "> " : "  ") + label);
      });
    }
    drawOverlayBox(lines);
  }

  function drawHighscoreBox(){
    if (!leaderboardAvailable){
      drawOverlayBox(["HIGH SCORE","SERVER OFFLINE","PRESS OK"]);
      return;
    }
    var lines = [];
    if (leaderboard.length === 0){
      lines.push("NO SCORES YET");
    } else {
      leaderboard.forEach(function(e){
        lines.push(e.name + " " + e.score);
      });
    }
    lines.push("PRESS OK");
    drawOverlayBox(lines);
  }

  function drawNameEntryBox(){
    var padded = nameEntry.chars.join("") + "_".repeat(8 - nameEntry.chars.length);
    var title = nameEntry.error || (nameEntry.mode === "edit" ? "EDIT NAME" : "TOP 5 SCORE!");
    var lines = [title, padded, "0=SPACE", "*DEL #OK"];
    drawOverlayBox(lines);
  }

  function drawSnakeDecor(){
    // idle wiggle preview on the start screen
    ctx.fillStyle = FG;
    var y = 3;
    for (var i=0;i<6;i++){
      ctx.fillRect(OX+4+i*CELL, OY + y*CELL, CELL-1, CELL-1);
    }
  }

  // ---------- main loop ----------
  function loop(ts){
    if (lastTime == null) lastTime = ts;
    var dt = ts - lastTime;
    lastTime = ts;

    if (state === "playing"){
      acc += dt;
      while (acc >= tickMs){
        step();
        acc -= tickMs;
        if (state !== "playing") { acc = 0; break; }
      }
    }
    render();
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  window.addEventListener("keydown", function(e){
    if (state === "nameentry"){
      nameEntryKey(e.key);
      e.preventDefault();
      return;
    }
    if (isMpState(state)){
      handleMpKey(e.key);
      e.preventDefault();
      return;
    }
    switch(e.key){
      case "ArrowUp": case "w": case "W": handleAction("up"); e.preventDefault(); break;
      case "ArrowDown": case "s": case "S": handleAction("down"); e.preventDefault(); break;
      case "ArrowLeft": case "a": case "A": handleAction("left"); e.preventDefault(); break;
      case "ArrowRight": case "d": case "D": handleAction("right"); e.preventDefault(); break;
      case " ": case "5": case "Enter": handleAction("action"); e.preventDefault(); break;
      case "2": handleAction("up"); e.preventDefault(); break;
      case "8": handleAction("down"); e.preventDefault(); break;
      case "4": handleAction("left"); e.preventDefault(); break;
      case "6": handleAction("right"); e.preventDefault(); break;
      case "1": handleAction("corner-ul"); e.preventDefault(); break;
      case "9": handleAction("corner-dr"); e.preventDefault(); break;
      case "*": handleAction("back"); e.preventDefault(); break;
    }
  });

  // pointerdown (not click) so a press registers immediately - click only
  // fires on release, which meant holding a button down near a wall never
  // turned you until you let go.
  document.querySelectorAll(".key").forEach(function(btn){
    var action = btn.getAttribute("data-action");
    var digit = btn.getAttribute("data-digit");
    btn.addEventListener("pointerdown", function(e){
      if (e.button > 0) return;
      e.preventDefault();
      if (state === "nameentry"){
        nameEntryKey(digit);
        return;
      }
      if (isMpState(state)){
        handleMpKey(digit);
        return;
      }
      if (action) handleAction(action);
    });
  });

  // Nokia-style nav cluster fixed under the screen - just dispatches the
  // matching physical key so it reuses all existing routing (menus,
  // gameplay, multiplayer, name entry) with no new logic.
  document.querySelectorAll(".dbtn").forEach(function(btn){
    var key = btn.getAttribute("data-key");
    btn.addEventListener("pointerdown", function(e){
      if (e.button > 0) return;
      e.preventDefault();
      window.dispatchEvent(new KeyboardEvent("keydown", {key: key, bubbles: true, cancelable: true}));
    });
  });

  // "1/9 ONLY" corner-turn zones, decided from real click geometry rather
  // than CSS percentage boxes - a fixed-size div nested in .keypad could
  // only ever cover .keypad's own box, never the gray gap above it or the
  // phone's own side padding, which is exactly where taps were being missed.
  // Captured on the whole document (not just .phone) since .phone itself
  // doesn't always fill the viewport width (width:min(92vw,380px) leaves a
  // sliver of background on each side on a real, narrower phone screen) -
  // a tap that visually lands "right next to key 9" can be just outside
  // .phone's own box and would never reach a listener scoped to it.
  // Overrides every keypad button's own handler (stopPropagation) while
  // gameplay + the option are active; taps on the Nokia nav cluster
  // (BACK/OK/up/down) are left untouched.
  var phoneEl = document.querySelector(".phone");
  var dpadEl = document.querySelector(".dpad");
  document.addEventListener("pointerdown", function(e){
    if (e.button > 0) return;
    if (!bigCornerButtons || state !== "playing") return;
    if (e.clientY < dpadEl.getBoundingClientRect().bottom) return;
    var pr = phoneEl.getBoundingClientRect();
    handleAction(e.clientX < pr.left + pr.width / 2 ? "corner-ul" : "corner-dr");
    e.stopPropagation();
  }, true);

  canvas.addEventListener("click", function(){
    if (state !== "playing") handleAction("action");
  });

  // swipe support
  var touchStart = null;
  canvas.addEventListener("touchstart", function(e){
    var t = e.changedTouches[0];
    touchStart = {x:t.clientX, y:t.clientY};
  }, {passive:true});
  canvas.addEventListener("touchend", function(e){
    if (!touchStart) return;
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStart.x;
    var dy = t.clientY - touchStart.y;
    if (Math.abs(dx) < 12 && Math.abs(dy) < 12){
      if (state !== "playing") handleAction("action");
      touchStart = null;
      return;
    }
    if (Math.abs(dx) > Math.abs(dy)){
      handleAction(dx > 0 ? "right" : "left");
    } else {
      handleAction(dy > 0 ? "down" : "up");
    }
    touchStart = null;
  }, {passive:true});

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
